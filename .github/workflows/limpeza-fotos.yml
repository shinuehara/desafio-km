# Uma vez por dia, pede ao site para apagar as fotos de desafios que terminaram há mais de 30 dias.
# Configure em Settings › Secrets and variables › Actions:
#   APP_URL      → endereço do site, ex.: https://desafio-km.vercel.app
#   CRON_SECRET  → o mesmo valor da variável CRON_SECRET do site
name: Limpeza de fotos antigas

on:
  schedule:
    - cron: "17 7 * * *" # 04:17 em Brasília
  workflow_dispatch:

jobs:
  limpeza:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a limpeza
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL ou CRON_SECRET não configurados; nada a fazer."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/limpeza"
