# Configuração para publicar na Netlify (plano gratuito).
# A Netlify detecta o Next.js e usa o adaptador oficial (@netlify/plugin-nextjs) sozinha.
[build]
  # "setup" cria/atualiza as tabelas e as pastas de arquivos antes de cada publicação.
  command = "npm run setup && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
